name: Hosted mathematics

on:
  pull_request:
    paths:
      - 'verification/hosted_math/**'
      - '.github/workflows/hosted-math.yml'

permissions:
  contents: read

concurrency:
  group: hosted-math-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CAPTURE_REVISION: '22593e351e4e9e5817f57d2033dba61a4fe4c550'
    steps:
      - name: Check out the validation branch and exact source history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Install capture packages
        run: |
          npm install --prefix "$RUNNER_TEMP/math-runtime" playwright@1.56.1 mathjax-full@3.2.1
      - name: Install Chromium on the stock runner
        run: node "$RUNNER_TEMP/math-runtime/node_modules/playwright/cli.js" install chromium
      - name: Compare every hosted mathematical expression
        run: |
          export NODE_PATH="$RUNNER_TEMP/math-runtime/node_modules"
          capture=(
            node verification/hosted_math/capture_hosted_math.cjs
            --root "$GITHUB_WORKSPACE"
            --repository "$GITHUB_REPOSITORY"
            --revision "$CAPTURE_REVISION"
          )
          if "${capture[@]}" --output "$RUNNER_TEMP/hosted-math"; then
            exit 0
          fi
          report="$RUNNER_TEMP/hosted-math/hosted-report.json"
          if test -f "$report" && grep -q 'transport_failure: Error: HTTP 50[234]' "$report"; then
            mv "$RUNNER_TEMP/hosted-math" "$RUNNER_TEMP/hosted-math-first"
            "${capture[@]}" --resume-from "$RUNNER_TEMP/hosted-math-first" --output "$RUNNER_TEMP/hosted-math"
          else
            exit 1
          fi
      - name: Retain the actual captures and comparison report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hosted-math-${{ env.CAPTURE_REVISION }}
          path: |
            ${{ runner.temp }}/hosted-math
            ${{ runner.temp }}/hosted-math-first
          if-no-files-found: error
          retention-days: 14
